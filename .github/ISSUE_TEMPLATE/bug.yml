name: 缺陷报告
description: 报告可复现的问题
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: impact
    attributes:
      label: 影响
      description: 哪些角色、门店或流程受影响？是否有临时解决办法？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用测试数据，按顺序写出操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交 SHA
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 环境
      options:
        - 开发
        - 测试
        - 预发布
        - 生产
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 必须脱敏，不要上传令牌、手机号、顾客信息或生产数据库内容。
  - type: dropdown
    id: severity
    attributes:
      label: 建议等级
      options:
        - P2 局部错误，有替代方案
        - P1 关键流程不可用
        - P0 数据泄露、损坏或系统整体不可用
        - P3 轻微问题
    validations:
      required: true
