name: Retail deployment image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retail-image.yml
      - Dockerfile
      - go.mod
      - go.sum
      - pkg/**
      - frontend/**

concurrency:
  group: retail-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror runtime images
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          docker pull --platform linux/amd64 postgres:16.14-alpine3.22
          docker tag postgres:16.14-alpine3.22 "$TARGET_IMAGE:postgres-16.14-alpine3.22"
          docker push "$TARGET_IMAGE:postgres-16.14-alpine3.22"
          docker pull --platform linux/amd64 caddy:2.11.4-alpine
          docker tag caddy:2.11.4-alpine "$TARGET_IMAGE:caddy-2.11.4-alpine"
          docker push "$TARGET_IMAGE:caddy-2.11.4-alpine"
          docker pull --platform linux/amd64 certbot/certbot:v5.4.0
          docker tag certbot/certbot:v5.4.0 "$TARGET_IMAGE:certbot-5.4.0"
          docker push "$TARGET_IMAGE:certbot-5.4.0"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:sha-${{ github.sha }}
          build-args: |
            RELEASE_VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
