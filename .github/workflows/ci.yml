name: ci

env:
  DO_NOT_TRACK: 1

on:
  # The upstream workflow depends on Vikunja's private runners and release
  # secrets. Keep it available for maintainers without producing a permanent
  # startup_failure on every push to this deployment fork.
  workflow_dispatch:

concurrency:
  # main merges use a unique run_id so they don't cancel each other
  # other branches or PRs share a group to auto-cancel old runs
  group: ${{ github.ref == 'refs/heads/main' &&
    format('{0}-{1}', github.workflow, github.run_id) ||
    format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
    uses: ./.github/workflows/release.yml
    needs:
      - test
    secrets: inherit
